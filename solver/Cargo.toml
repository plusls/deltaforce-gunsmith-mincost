[package]
name = "gunsmith-mincost"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "solve"
path = "src/bin/solve.rs"

[[bin]]
name = "bf"
path = "src/bin/bf.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"

[dev-dependencies]
flate2 = "1"
