name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust tests
        run: cargo test

      - name: Build native binaries
        run: cargo build --release

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown -p delta-weapon-solver

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS tests
        run: node --test solver/js/*.test.mjs userscript/test/*.test.mjs

      - name: Build userscript
        run: node userscript/build.mjs
