name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown -p gunsmith-mincost

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build userscript
        run: node userscript/build.mjs

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" userscript/dist/gunsmith-mincost.user.js --clobber
